---
# =============================================================================
# main.yml — role orchestrator
#
# Execution order:
#   1. validate.yml  (tags: always — always runs, pure asserts, no API)
#   2. preflight.yml (checks collection availability, no API)
#   3. Per-resource includes (only when hcloud_provision), in two phases:
#      present items in creation order, then absent items in reverse
#      dependency order (each include passes _hcloud_phase to its tasks).
#      Wrapped in module_defaults to pass api_token once for all hcloud modules.
#   4. outputs.yml   (emit facts / optionally write inventory file)
#
# Offline gate: hcloud_provision: false skips all hetzner.hcloud.* tasks.
# =============================================================================

- name: Validate configuration
  ansible.builtin.import_tasks: validate.yml
  tags: always

- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - hcloud
    - preflight

# ── Resource provisioning block ───────────────────────────────────────────────
# All hetzner.hcloud.* module calls live inside this block.
# module_defaults passes the API token once, centrally (group/hetzner.hcloud.all),
# so it is not repeated in every task file. The token is redacted automatically
# because the hetzner.hcloud modules declare api_token as no_log. user_data, the
# only other secret-bearing field, is masked by the task-level no_log in
# servers.yml. We deliberately do NOT set a block-wide no_log so that normal,
# non-secret task errors stay visible for debugging (set hcloud_no_log=false to
# unmask user_data when needed).
- name: Provision Hetzner Cloud resources
  when: hcloud_provision | bool
  module_defaults:
    group/hetzner.hcloud.all:
      api_token: "{{ hcloud_api_token }}"
  block:
    # Present phase: create/update in dependency order.
    - name: Manage SSH keys
      ansible.builtin.include_tasks:
        file: ssh_keys.yml
        apply:
          tags:
            - hcloud
            - ssh_keys
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_ssh_keys | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - ssh_keys

    - name: Manage networks
      ansible.builtin.include_tasks:
        file: networks.yml
        apply:
          tags:
            - hcloud
            - networks
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_networks | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - networks

    - name: Manage subnetworks
      ansible.builtin.include_tasks:
        file: subnetworks.yml
        apply:
          tags:
            - hcloud
            - subnetworks
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_subnetworks | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - subnetworks

    - name: Manage firewalls
      ansible.builtin.include_tasks:
        file: firewalls.yml
        apply:
          tags:
            - hcloud
            - firewalls
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_firewalls | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - firewalls

    - name: Manage placement groups
      ansible.builtin.include_tasks:
        file: placement_groups.yml
        apply:
          tags:
            - hcloud
            - placement_groups
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_placement_groups | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - placement_groups

    - name: Manage primary IPs
      ansible.builtin.include_tasks:
        file: primary_ips.yml
        apply:
          tags:
            - hcloud
            - primary_ips
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_primary_ips | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - primary_ips

    - name: Manage servers
      ansible.builtin.include_tasks:
        file: servers.yml
        apply:
          tags:
            - hcloud
            - servers
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_servers | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - servers

    # After the servers, so apply_to 'server' entries can bind to servers
    # created in this run.
    - name: Bind firewalls to resources
      ansible.builtin.include_tasks:
        file: firewall_bindings.yml
        apply:
          tags:
            - hcloud
            - firewalls
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_firewalls | map(attribute='apply_to', default=[])
        | flatten | length > 0
      tags:
        - hcloud
        - firewalls

    - name: Attach servers to networks
      ansible.builtin.include_tasks:
        file: server_networks.yml
        apply:
          tags:
            - hcloud
            - server_networks
            - servers
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_server_networks | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - server_networks
        - servers

    # Read servers back after the network attachments: the server module
    # returns create-time data (no private IPs yet on the first run, null for
    # absent servers), so outputs.yml is built from this refreshed state.
    - name: Refresh provisioned server state
      hetzner.hcloud.server_info:
        name: "{{ item.name }}"
      loop: "{{ hcloud_servers }}"
      loop_control:
        label: "{{ item.name }}"
      register: _hcloud_server_refresh
      when: (item.state | default(hcloud_state)) == 'present'
      tags:
        - hcloud
        - servers
        - server_networks
        - outputs

    - name: Manage floating IPs
      ansible.builtin.include_tasks:
        file: floating_ips.yml
        apply:
          tags:
            - hcloud
            - floating_ips
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_floating_ips | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - floating_ips

    - name: Manage volumes
      ansible.builtin.include_tasks:
        file: volumes.yml
        apply:
          tags:
            - hcloud
            - volumes
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_volumes | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - volumes

    - name: Manage load balancers
      ansible.builtin.include_tasks:
        file: load_balancers.yml
        apply:
          tags:
            - hcloud
            - load_balancers
      vars:
        _hcloud_phase: present
      when: >-
        hcloud_load_balancers | map(attribute='state', default=hcloud_state)
        | select('eq', 'present') | list | length > 0
      tags:
        - hcloud
        - load_balancers

    # Absent phase: delete in reverse dependency order, so children go before
    # their parents (LB before its network, attachments before servers,
    # servers before the firewalls/placement groups they use, subnets before
    # networks). Each task only acts on items whose state matches the phase.
    - name: Delete absent load balancers
      ansible.builtin.include_tasks:
        file: load_balancers.yml
        apply:
          tags:
            - hcloud
            - load_balancers
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_load_balancers | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - load_balancers

    - name: Delete absent volumes
      ansible.builtin.include_tasks:
        file: volumes.yml
        apply:
          tags:
            - hcloud
            - volumes
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_volumes | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - volumes

    - name: Delete absent floating IPs
      ansible.builtin.include_tasks:
        file: floating_ips.yml
        apply:
          tags:
            - hcloud
            - floating_ips
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_floating_ips | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - floating_ips

    - name: Delete absent primary IPs
      ansible.builtin.include_tasks:
        file: primary_ips.yml
        apply:
          tags:
            - hcloud
            - primary_ips
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_primary_ips | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - primary_ips

    - name: Detach servers from networks
      ansible.builtin.include_tasks:
        file: server_networks.yml
        apply:
          tags:
            - hcloud
            - server_networks
            - servers
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_server_networks | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - server_networks
        - servers

    - name: Delete absent servers
      ansible.builtin.include_tasks:
        file: servers.yml
        apply:
          tags:
            - hcloud
            - servers
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_servers | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - servers

    - name: Delete absent placement groups
      ansible.builtin.include_tasks:
        file: placement_groups.yml
        apply:
          tags:
            - hcloud
            - placement_groups
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_placement_groups | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - placement_groups

    - name: Delete absent firewalls
      ansible.builtin.include_tasks:
        file: firewalls.yml
        apply:
          tags:
            - hcloud
            - firewalls
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_firewalls | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - firewalls

    - name: Delete absent subnetworks
      ansible.builtin.include_tasks:
        file: subnetworks.yml
        apply:
          tags:
            - hcloud
            - subnetworks
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_subnetworks | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - subnetworks

    - name: Delete absent networks
      ansible.builtin.include_tasks:
        file: networks.yml
        apply:
          tags:
            - hcloud
            - networks
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_networks | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - networks

    - name: Delete absent SSH keys
      ansible.builtin.include_tasks:
        file: ssh_keys.yml
        apply:
          tags:
            - hcloud
            - ssh_keys
      vars:
        _hcloud_phase: absent
      when: >-
        hcloud_ssh_keys | map(attribute='state', default=hcloud_state)
        | select('eq', 'absent') | list | length > 0
      tags:
        - hcloud
        - ssh_keys

- name: Emit outputs
  ansible.builtin.import_tasks: outputs.yml
  tags:
    - hcloud
    - outputs
