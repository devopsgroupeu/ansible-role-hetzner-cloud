---
# =============================================================================
# floating_ips.yml — create/manage location-scoped floating IPs
#
# Module: hetzner.hcloud.floating_ip
# Loop:   hcloud_floating_ips
# Gate:   called only when hcloud_floating_ips | length > 0 and hcloud_provision
#         (both enforced in main.yml)
#
# home_location is required on create unless 'server' is given (the IP then
# anchors to that server's location). 'server' sets the initial assignment;
# after that, runtime assignment is owned by keepalived (or another external
# load balancer), which flips the IP between nodes via the Hetzner API.
# The role never detaches an assigned IP unless 'unassign: true' is set: when
# 'server' is omitted, the current assignee is read and passed back to the
# module, which is a no-op. state=absent deletes with force (unassign first).
# =============================================================================

- name: Read current floating IP assignment
  hetzner.hcloud.floating_ip_info:
    name: "{{ item.name }}"
  loop: "{{ hcloud_floating_ips }}"
  loop_control:
    label: "{{ item.name }}"
  register: _hcloud_fip_current
  when:
    - (item.state | default(hcloud_state)) == _hcloud_phase
    - (item.state | default(hcloud_state)) != 'absent'
    - item.server | default('', true) | length == 0
    - not (item.unassign | default(false) | bool)

- name: Manage floating IPs
  hetzner.hcloud.floating_ip:
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    home_location: "{{ omit if _hcloud_fip_server | length > 0 else (item.home_location | default(omit, true)) }}"
    server: "{{ _hcloud_fip_server | default(omit, true) }}"
    force: "{{ (item.state | default(hcloud_state)) == 'absent' }}"
    description: "{{ item.description | default(omit, true) }}"
    delete_protection: "{{ item.delete_protection | default(omit) }}"
    labels: "{{ {hcloud_managed_label_key: hcloud_managed_label_value} | combine(item.labels | default({})) }}"
    state: "{{ item.state | default(hcloud_state) }}"
  vars:
    _hcloud_fip_assigned: >-
      {{ ((_hcloud_fip_current.results[_hcloud_fip_idx].hcloud_floating_ip_info | default([]))
          | first | default({})).server | default('', true) }}
    _hcloud_fip_server: "{{ item.server | default(_hcloud_fip_assigned, true) }}"
  loop: "{{ hcloud_floating_ips }}"
  loop_control:
    label: "{{ item.name }} ({{ item.type }}, {{ item.state | default(hcloud_state) }})"
    index_var: _hcloud_fip_idx
  register: hcloud_floating_ip_results
  when: (item.state | default(hcloud_state)) == _hcloud_phase
