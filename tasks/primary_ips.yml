---
# =============================================================================
# primary_ips.yml - create/manage pre-allocated stable public IPs
#
# Module: hetzner.hcloud.primary_ip
# Loop:   hcloud_primary_ips
# Gate:   called only when hcloud_primary_ips | length > 0 and hcloud_provision
#         (both enforced in main.yml)
#
# Placement is by location only (Hetzner removed 'datacenter' on 2026-07-01).
# location defaults to hcloud_default_location unless 'server' is set, which
# assigns the IP to that existing server (it must be powered off). Omitting
# 'server' never unassigns an IP. The present phase runs before servers so a
# server can reference a primary IP created in the same run; the absent phase
# runs after the servers, because deleting an assigned IP unassigns it first
# and Hetzner only allows that on a powered-off server.
# =============================================================================

- name: Manage primary IPs
  hetzner.hcloud.primary_ip:
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    location: "{{ item.location | default(omit if (item.server | default('', true)) else hcloud_default_location, true) }}"
    server: "{{ item.server | default(omit, true) }}"
    auto_delete: "{{ item.auto_delete | default(false) }}"
    delete_protection: "{{ item.delete_protection | default(omit) }}"
    labels: "{{ {hcloud_managed_label_key: hcloud_managed_label_value} | combine(item.labels | default({})) }}"
    state: "{{ item.state | default(hcloud_state) }}"
  loop: "{{ hcloud_primary_ips }}"
  loop_control:
    label: "{{ item.name }} ({{ item.type }}, {{ item.state | default(hcloud_state) }})"
  register: hcloud_primary_ip_results
  when: (item.state | default(hcloud_state)) == _hcloud_phase
