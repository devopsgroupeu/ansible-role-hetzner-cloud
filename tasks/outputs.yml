---
# =============================================================================
# outputs.yml — expose role facts and optionally write a static inventory
#
# Safe offline: _hcloud_server_refresh is only registered when hcloud_provision
# is true. When the offline molecule scenario runs (hcloud_provision: false)
# the variable is never set, so we guard with default({'results': []}) to
# avoid undefined-variable errors.
#
# hcloud_provisioned_servers - list of server dicts (name, ipv4_address,
#   private_networks_info, labels, server_type, ...) from hetzner.hcloud.server_info,
#   read after the network attachments (main.yml). Absent servers and skipped
#   items are left out. Downstream plays can iterate this directly or use
#   add_host to build an in-memory inventory.
# =============================================================================

- name: Expose provisioned servers as a role fact
  ansible.builtin.set_fact:
    hcloud_provisioned_servers: >-
      {{ (_hcloud_server_refresh | default({'results': []})).results
         | selectattr('hcloud_server_info', 'defined')
         | map(attribute='hcloud_server_info')
         | flatten
         | select('mapping')
         | list }}

- name: Write static inventory for downstream roles
  ansible.builtin.template:
    src: hcloud_inventory.yml.j2
    dest: "{{ hcloud_inventory_path }}"
    mode: "0640"
  when: hcloud_write_inventory | bool
