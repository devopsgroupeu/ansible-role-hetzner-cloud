---
# =============================================================================
# firewalls.yml - create/manage firewalls with rules
#
# Module: hetzner.hcloud.firewall
# Loop:   hcloud_firewalls
# Gate:   called only when hcloud_firewalls | length > 0 and hcloud_provision
#         (both enforced in main.yml)
#
# Bindings (apply_to) are managed by firewall_bindings.yml, which main.yml
# includes after the servers so that server bindings can target servers
# created in the same run.
# =============================================================================

- name: Manage firewalls
  hetzner.hcloud.firewall:
    name: "{{ item.name }}"
    rules: "{{ item.rules | default(omit) }}"
    labels: "{{ {hcloud_managed_label_key: hcloud_managed_label_value} | combine(item.labels | default({})) }}"
    # Absent firewalls are removed from their remaining resources (label
    # selectors) first; servers using them are deleted earlier in the phase.
    force: "{{ (item.state | default(hcloud_state)) == 'absent' }}"
    state: "{{ item.state | default(hcloud_state) }}"
  loop: "{{ hcloud_firewalls }}"
  loop_control:
    label: "{{ item.name }} ({{ item.state | default(hcloud_state) }})"
  register: hcloud_firewall_results
  when: (item.state | default(hcloud_state)) == _hcloud_phase
