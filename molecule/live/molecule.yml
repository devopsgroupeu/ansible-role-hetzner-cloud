---
# =============================================================================
# molecule/live/molecule.yml - LIVE delegated scenario
#
# IMPORTANT: This scenario creates REAL Hetzner Cloud resources.
# It is NOT part of default CI. It requires a valid HCLOUD_TOKEN and will
# INCUR BILLING on your Hetzner account (throwaway project recommended).
#
# Intended use:
#   - Manual CI run: the "Live" workflow (.github/workflows/live.yml), run
#     by hand via workflow_dispatch; it needs the HCLOUD_TOKEN secret
#   - Local developer testing against a dedicated test project
#
# Usage:
#   export HCLOUD_TOKEN="your-throwaway-project-token"
#   molecule test -s live
#
# Resources created: cx23 server in nbg1 (cheapest type / EU location).
# Resources are always destroyed at the end of `molecule test` (even on failure).
# Do NOT run `molecule converge -s live` without `molecule destroy -s live` after.
# =============================================================================

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: default

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    HCLOUD_TOKEN: "${HCLOUD_TOKEN}"
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            # The controller's Python has the collection's requirements.
            ansible_python_interpreter: "{{ ansible_playbook_python }}"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - converge
    - idempotence
    - verify
    - destroy
