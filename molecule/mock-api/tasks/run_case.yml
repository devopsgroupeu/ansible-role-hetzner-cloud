---
# Reset the mock to case.seed, run cases/<case.playbook> case.runs times
# (with case.args and the extra environment case.env) and expose the runs
# (mock_case_runs), the request log (mock_requests) and the resulting
# resources (mock_state).
- name: Reset the mock API state - {{ case.name }}
  ansible.builtin.uri:
    url: "{{ mock_url }}/__mock/reset"
    method: POST
    body_format: json
    body:
      seed: "{{ case.seed | default({}) }}"

- name: Run the case playbook - {{ case.name }}
  ansible.builtin.command:
    argv: >-
      {{ ['ansible-playbook', '-i', 'localhost,', playbook_dir ~ '/cases/' ~ case.playbook]
         + (case.args | default([])) }}
  loop: "{{ range(case.runs | default(1)) | list }}"
  loop_control:
    label: "{{ case.name }} run {{ item + 1 }}"
  # Plain output, so assertions can search the run's stdout.
  environment: "{{ {'ANSIBLE_NOCOLOR': '1', 'ANSIBLE_FORCE_COLOR': '0'} | combine(case.env | default({})) }}"
  register: mock_case_runs
  changed_when: false
  failed_when: false

- name: Read the mock API request log - {{ case.name }}
  ansible.builtin.uri:
    url: "{{ mock_url }}/__mock/log"
    return_content: true
  register: mock_case_log

- name: Read the mock API resources - {{ case.name }}
  ansible.builtin.uri:
    url: "{{ mock_url }}/__mock/state"
    return_content: true
  register: mock_case_state

- name: Expose the request log and resources - {{ case.name }}
  ansible.builtin.set_fact:
    mock_requests: "{{ mock_case_log.json.requests }}"
    mock_state: "{{ mock_case_state.json }}"
